name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild racket, string and shuttle data
        run: |
          python3 scripts/build_rackets.py
          python3 scripts/build_strings.py
          python3 scripts/build_shuttles.py
          python3 scripts/build_gear.py

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css tokens.css base.css _site/
          cp -r data _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html
          sed -i -E "s#\./(tokens|base)\.css#./\1.css?v=${GITHUB_SHA::7}#g" _site/styles.css

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
