name: Check catalog and deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild racket, string and shuttle data
        run: |
          python3 scripts/build_rackets.py
          python3 scripts/build_strings.py
          python3 scripts/build_shuttles.py
          python3 scripts/build_gear.py

      - name: Run tests
        run: |
          node tests/run.js
          python3 -m unittest discover -s tests

      - name: Collect site files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html og.png app.js styles.css tokens.css base.css look.css _site/
          cp -r data _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html
          sed -i -E "s#\./(tokens|base)\.css#./\1.css?v=${GITHUB_SHA::7}#g" _site/styles.css

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
