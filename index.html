<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เทียบไม้แบด</title>
  <meta name="description" content="เทียบสเปกไม้แบด เอ็น ลูกแบด รองเท้า และถุงเท้า ทีละสามรุ่น และจับคู่ไม้กับเอ็นพร้อมปอนด์ที่แนะนำ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500&family=Wix+Madefor+Text:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500&family=Anuphan:wght@400;500;600&family=Kanit:wght@500;600&family=Noto+Serif+Thai:wght@600&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=__V__">
  <link rel="stylesheet" href="themes.css?v=__V__">
  <link rel="stylesheet" href="layouts.css?v=__V__">
  <script>
    // ?style=store&theme=court picks a look from a link (choose.html); a saved choice applies otherwise
    (function () {
      var q = new URLSearchParams(location.search), d = document.documentElement, ls = null;
      try { ls = window.localStorage; } catch (e) {}
      ['style', 'theme'].forEach(function (k) {
        var v = q.has(k) ? q.get(k) : (ls ? ls.getItem(k) : null);
        if (q.has(k) && q.has('save') && ls) { try { v ? ls.setItem(k, v) : ls.removeItem(k); } catch (e) {} }
        if (v) d.dataset[k] = v;
      });
      // the sport layout is drawn for the black-and-white palette: it takes it unless a theme was chosen
      if (d.dataset.style === 'sport' && !d.dataset.theme) d.dataset.theme = 'mono';
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="container top-in">
      <a class="logo" href="#rackets">เทียบไม้แบด</a>
      <nav class="tabs" id="tabs" aria-label="หน้า">
        <a href="#rackets" data-v="rackets">ไม้แบด</a>
        <a href="#strings" data-v="strings">เอ็น</a>
        <a href="#shuttles" data-v="shuttles">ลูกแบด</a>
        <a href="#shoes" data-v="shoes">รองเท้า</a>
        <a href="#socks" data-v="socks">ถุงเท้า</a>
        <a href="#match" data-v="match">จับคู่ไม้+เอ็น</a>
        <a href="#manage" data-v="manage">จัดการข้อมูล</a>
      </nav>
      <div class="theme-pick">
        <label for="style">สไตล์</label>
        <select id="style">
          <option value="">เดิม</option>
          <option value="sport">สปอร์ต</option>
          <option value="store">ร้านกีฬา</option>
          <option value="table">ตารางสเปก</option>
          <option value="app">แอป</option>
        </select>
        <label for="theme">ธีม</label>
        <select id="theme">
          <option value="">ค่ำ</option>
          <option value="court">สนาม</option>
          <option value="volt">โวลต์</option>
          <option value="paper">กระดาษ</option>
          <option value="sky">ฟ้า</option>
          <option value="mono">ขาวดำ</option>
        </select>
      </div>
    </div>
  </header>
  <main class="container" id="view"></main>
  <div class="tray" id="tray" hidden></div>

  <!-- __V__ is replaced with the commit hash on deploy so browsers fetch fresh data -->
  <script src="data/rackets.js?v=__V__"></script>
  <script src="data/strings.js?v=__V__"></script>
  <script src="data/shuttles.js?v=__V__"></script>
  <script src="data/shoes.js?v=__V__"></script>
  <script src="data/socks.js?v=__V__"></script>
  <script src="app.js?v=__V__"></script>
</body>
</html>
